name: Update data

on:
  schedule:
    - cron: '45 4 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '15 9 * * 1-5'
    - cron: '45 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices and build data.json
        run: node fetch-data.mjs
      - name: Save data.json
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
